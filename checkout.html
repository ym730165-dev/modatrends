<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتمام الشراء | ModaTrends</title>
  <link rel="stylesheet" href="SHOPAZOUZ.css">
</head>
<body>

  <header class="checkout-header">
    <h1>🛍️ إتمام عملية الشراء</h1>
  </header>

  <main class="checkout-container">
    <section class="order-summary">
      <h2>الطلب</h2>
      <ul id="checkout-items"></ul>
      <div class="total">
        <strong>المجموع:</strong> <span id="checkout-total">0 د.ت</span>
      </div>
    </section>

    <section class="customer-info">
      <h2>معلومات الطلب</h2>
      <!-- ✅ تم إصلاح وسم الفورم -->
      <form id="checkout-form">
        <input type="text" id="name" placeholder="الاسم الكامل" required>
        <input type="text" id="address" placeholder="العنوان" required>
        <input type="tel" id="phone" placeholder="رقم الهاتف" required>

        <select id="payment" required>
          <option value="">اختر وسيلة الدفع</option>
          <option value="cash">الدفع عند الاستلام</option>
          <option value="card">بطاقة بنكية</option>
        </select>

        <button type="submit">تأكيد الطلب ✅</button>
      </form>
    </section>
  </main>

  <footer>
    <a href="admin.html" class="cta-button">⬅️ الرجوع إلى المتجر</a>
  </footer>

  <script src="checkout.js"></script>
</body>
</html>
